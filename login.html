<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#F5F4FF; --card:#FFFFFF; --accent:#4F46E5; --accent-hover:#4338CA;
      --accent-light:#EEF2FF; --text:#18181B; --muted:#71717A; --border:#E4E4E7;
      --error:#EF4444; --sidebar:#1E1B4B;
    }
    body {
      font-family:'Plus Jakarta Sans',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    /* Background decoration */
    body::before {
      content:'';
      position:fixed;
      top:-200px; right:-200px;
      width:600px; height:600px;
      background:radial-gradient(circle, rgba(79,70,229,.12) 0%, transparent 70%);
      pointer-events:none;
    }
    body::after {
      content:'';
      position:fixed;
      bottom:-200px; left:-200px;
      width:500px; height:500px;
      background:radial-gradient(circle, rgba(129,140,248,.10) 0%, transparent 70%);
      pointer-events:none;
    }

    .login-wrap {
      width:100%;
      max-width:420px;
      animation: fadeUp .35s ease;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* Logo */
    .logo {
      text-align:center;
      font-size:26px;
      font-weight:800;
      color:var(--sidebar);
      letter-spacing:-0.5px;
      margin-bottom:28px;
    }
    .logo span { color:#818CF8; }

    /* Card */
    .card {
      background:var(--card);
      border-radius:16px;
      border:1px solid var(--border);
      padding:36px 32px;
      box-shadow:0 4px 24px rgba(79,70,229,.07);
    }

    .card-title {
      font-size:20px;
      font-weight:800;
      color:var(--text);
      margin-bottom:4px;
    }
    .card-sub {
      font-size:13px;
      color:var(--muted);
      margin-bottom:28px;
    }

    /* Form */
    .form-group { margin-bottom:18px; }
    .form-label {
      display:block;
      font-size:12px;
      font-weight:700;
      color:var(--text);
      margin-bottom:6px;
      text-transform:uppercase;
      letter-spacing:.5px;
    }
    .input-wrap { position:relative; }
    .form-input {
      width:100%;
      padding:11px 14px;
      border:1.5px solid var(--border);
      border-radius:9px;
      font-family:inherit;
      font-size:14px;
      color:var(--text);
      background:var(--bg);
      outline:none;
      transition:border-color .15s, box-shadow .15s;
    }
    .form-input:focus {
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(79,70,229,.12);
      background:#fff;
    }
    .form-input.error { border-color:var(--error); }
    .form-input::placeholder { color:#B0AEC0; }

    /* Password toggle */
    .pwd-toggle {
      position:absolute;
      right:12px; top:50%;
      transform:translateY(-50%);
      background:none; border:none;
      cursor:pointer; color:var(--muted);
      font-size:15px; padding:4px;
      line-height:1;
      transition:color .15s;
    }
    .pwd-toggle:hover { color:var(--accent); }
    #inp-password { padding-right:40px; }

    /* Error message */
    .field-error {
      font-size:11px;
      color:var(--error);
      margin-top:5px;
      display:none;
    }
    .field-error.visible { display:block; }

    /* Remember + Forgot row */
    .extras-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:22px;
    }
    .checkbox-label {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      color:var(--muted);
      cursor:pointer;
      user-select:none;
    }
    .checkbox-label input[type="checkbox"] {
      width:15px; height:15px;
      accent-color:var(--accent);
      cursor:pointer;
    }
    .forgot-link {
      font-size:13px;
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
    }
    .forgot-link:hover { text-decoration:underline; }

    /* Submit button */
    .btn-signin {
      width:100%;
      padding:12px;
      background:var(--accent);
      color:white;
      border:none;
      border-radius:9px;
      font-family:inherit;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      transition:background .15s, transform .1s, box-shadow .15s;
      letter-spacing:.2px;
    }
    .btn-signin:hover { background:var(--accent-hover); box-shadow:0 4px 14px rgba(79,70,229,.3); }
    .btn-signin:active { transform:scale(.98); }
    .btn-signin:disabled { opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }

    /* Divider */
    .divider {
      display:flex; align-items:center; gap:12px;
      margin:22px 0;
      color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px; background:var(--border);
    }

    /* Social / guest */
    .btn-guest {
      width:100%;
      padding:11px;
      background:transparent;
      color:var(--text);
      border:1.5px solid var(--border);
      border-radius:9px;
      font-family:inherit;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
      transition:border-color .15s, background .15s;
    }
    .btn-guest:hover { border-color:var(--accent); background:var(--accent-light); }

    /* Signup prompt */
    .signup-row {
      text-align:center;
      margin-top:22px;
      font-size:13px;
      color:var(--muted);
    }
    .signup-row a {
      color:var(--accent);
      font-weight:700;
      text-decoration:none;
    }
    .signup-row a:hover { text-decoration:underline; }

    /* Toast */
    .toast {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
      background:#18181B; color:white; padding:11px 20px; border-radius:8px;
      font-size:13px; font-weight:500; opacity:0; pointer-events:none;
      transition:opacity .25s, transform .25s; z-index:999; white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="logo">Study<span>Flow</span></div>

  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your StudyFlow account</div>

    <form id="login-form" onsubmit="handleLogin(event)" novalidate>

      <div class="form-group">
        <label class="form-label" for="inp-email">Email address</label>
        <div class="input-wrap">
          <input class="form-input" id="inp-email" type="email"
                 placeholder="you@student.edu" autocomplete="email">
        </div>
        <div class="field-error" id="err-email">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="inp-password">Password</label>
        <div class="input-wrap">
          <input class="form-input" id="inp-password" type="password"
                 placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pwd-toggle" id="pwd-toggle" onclick="togglePwd()" aria-label="Show password">
            👁
          </button>
        </div>
        <div class="field-error" id="err-password">Password must be at least 6 characters.</div>
      </div>

      <div class="extras-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me">
          Remember me
        </label>
        <a href="#" class="forgot-link" onclick="showForgot(event)">Forgot password?</a>
      </div>

      <button class="btn-signin" type="submit" id="btn-signin">Sign in</button>
    </form>

    <div class="divider">or</div>

    <button class="btn-guest" onclick="continueAsGuest()">Continue as guest (demo)</button>

    <div class="signup-row">
      Don't have an account? <a href="#" onclick="showSignup(event)">Sign up free</a>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // --- Password visibility toggle ---
  function togglePwd() {
    const inp = document.getElementById('inp-password');
    const btn = document.getElementById('pwd-toggle');
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.textContent = '🙈';
      btn.setAttribute('aria-label', 'Hide password');
    } else {
      inp.type = 'password';
      btn.textContent = '👁';
      btn.setAttribute('aria-label', 'Show password');
    }
  }

  // --- Validation helpers ---
  function setError(inputId, errId, show) {
    const inp = document.getElementById(inputId);
    const err = document.getElementById(errId);
    inp.classList.toggle('error', show);
    err.classList.toggle('visible', show);
  }

  // --- Login handler ---
  function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('inp-email').value.trim();
    const password = document.getElementById('inp-password').value;
    let valid = true;

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    setError('inp-email', 'err-email', !emailOk);
    if (!emailOk) valid = false;

    const pwdOk = password.length >= 6;
    setError('inp-password', 'err-password', !pwdOk);
    if (!pwdOk) valid = false;

    if (!valid) return;

    // Demo: simulate sign-in
    const btn = document.getElementById('btn-signin');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    setTimeout(() => {
      // In a real app this would POST credentials and redirect on success.
      // For the prototype we just jump straight to the dashboard.
      window.location.href = 'index.html';
    }, 900);
  }

  // --- Guest / demo shortcut ---
  function continueAsGuest() {
    window.location.href = 'index.html';
  }

  // --- Placeholder stubs ---
  function showForgot(e) {
    e.preventDefault();
    toast('Password reset link sent! (demo)');
  }

  function showSignup(e) {
    e.preventDefault();
    toast('Sign-up flow coming soon!');
  }

  // --- Toast ---
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // Clear error state on input
  ['inp-email','inp-password'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById(id).classList.remove('error');
      const errId = 'err-' + id.replace('inp-','');
      const errEl = document.getElementById(errId);
      if (errEl) errEl.classList.remove('visible');
    });
  });
</script>
</body>
</html>
